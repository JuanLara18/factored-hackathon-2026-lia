# Reglas de escalamiento a un humano, en orden de prioridad: gana la primera que coincide.
# condicion: urgente | estado_en (usa `estados`) | producto_desconocido
reglas:
  - id: ESC-01
    condicion: urgente
    motivo: urgente
    fundamento: R-GOB-28
    razon: "Transferencia inmediata no reconocida o engaño telefónico: solo cuentan los minutos, traspaso inmediato."
  - id: ESC-02
    condicion: estado_en
    estados: [declined, failed, reversed]
    motivo: transaccion_no_disputable
    fundamento: A-04
    razon: "Un cargo rechazado, fallido o revertido no se cobró: se explica con la ficha y, si insiste, va a un humano."
  - id: ESC-03
    condicion: producto_desconocido
    motivo: producto_no_encontrado
    fundamento: A-21
    razon: "Sin producto verificable en la base no se afirma ni se radica nada: ninguna acción y a revisión humana."
# Urgencia (P1): la decide el motivo, de una lista cerrada. La bandera `urgente` que traiga el modelo no vale
# por sí sola: un cliente no puede subir su propio caso de prioridad con una orden escrita (R27).
urgencia:
  id: ESC-05
  motivos: [urgente, transferencia_en_curso, fraude_en_curso, suplantacion]
  fundamento: R-GOB-28
  razon: "Solo una transferencia inmediata no reconocida, un fraude en curso o una suplantación del banco son P1; pedirlo en el chat no lo es."
# Monto sobre el umbral (A-07): la disputa se radica y ADEMÁS el caso pasa a un humano (R5); no la reemplaza.
# Umbral por moneda del registro, en USD a la fecha del evento; si no hay entrada aplica `por_defecto`.
radicar_y_escalar:
  id: ESC-04
  motivo: monto_sobre_umbral
  por_defecto:
    limite_usd: 1000
    fundamento: A-07
    razon: "PROVISIONAL: la definición no fija el umbral de A-07. Supuesto sintético muy por encima del tope del crédito provisional (200 USD), pendiente de fijarse con montos de desarrollo (R-GOB-27)."
  por_moneda:
    MXN:
      limite_usd: 1000
      fundamento: A-07
      razon: "PROVISIONAL: igual al de defecto hasta tener montos de desarrollo de México."
    COP:
      limite_usd: 1000
      fundamento: A-07
      razon: "PROVISIONAL: igual al de defecto hasta tener montos de desarrollo de Colombia."
    ARS:
      limite_usd: 1000
      fundamento: A-07
      razon: "PROVISIONAL: igual al de defecto hasta tener montos de desarrollo de Argentina."
