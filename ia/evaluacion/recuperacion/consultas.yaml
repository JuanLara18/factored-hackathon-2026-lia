# Juicios de relevancia para la recuperación de política (IA-12): pregunta del cliente -> artículo relevante
# de `clientes/conocimiento/articulos.yaml`. `articulo: null` es una pregunta que la base no cubre: lo correcto
# es no citar nada. Escritas por el equipo (un solo autor), sin mirar resultados del recuperador. Ninguna repite
# una pregunta de los escenarios de desarrollo ni de los conjuntos retenidos (lo comprueba una prueba).
# La partición en validación y prueba se hace por código con semilla fija, estratificada por artículo.
