id: M1_robo_y_dos_cobros
version: 1.0.0
categoria: M
descripcion: "Varios pedidos: tarjeta robada y dos cobros que no reconoce; se bloquea y se disputan los dos, cada acción con su aprobación."
cliente: CUST-0001
guion:
  objetivo: "Le robaron la tarjeta y no reconoce dos cobros: el de Farmacia Sur y el de Cafe Central. Quiere bloquear la tarjeta y reclamar los dos. Aprueba cada acción que el asistente proponga. No pide hablar con una persona."
  max_turnos: 10
