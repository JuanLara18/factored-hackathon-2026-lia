      intencion: hablar
    - decir: "Sí, bloquéela"
      intencion: confirmar
    - decir: "Sí, ese"
      intencion: confirmar
    - decir: "Sí, el otro también"
      intencion: confirmar
esperado:
  casos: [[CUST-0001, TX-1010], [CUST-0001, TX-1004]]
  bloqueos: [[CUST-0001, PRD-1]]
  traspasos: 0
  debe_escalar: false
  herramientas_requeridas: [bloquear_tarjeta, abrir_disputa]
  max_aprobaciones: 3
  texto_tras_aprobacion: true
