# Generado desde ia/agentes/trabajadores con `python -m latam_ia.registro`; no editar a mano.
model_list:
- model_name: comprension
  litellm_params:
    model: gemini/gemini-2.5-flash-lite
    api_key: os.environ/GEMINI_API_KEY
    temperature: 0.0
    max_tokens: 200
- model_name: disputas
  litellm_params:
    model: vertex_ai/gemini-3.1-flash-lite
    vertex_project: os.environ/LATAM_GCP_PROJECT
    vertex_location: os.environ/LATAM_GEAP_LOCATION
    temperature: 0.0
    max_tokens: 600
- model_name: redaccion
  litellm_params:
    model: gemini/gemini-2.5-flash-lite
    api_key: os.environ/GEMINI_API_KEY
    temperature: 0.0
    max_tokens: 300
claves_virtuales:
- key_alias: lb-comprension-local
  models:
  - comprension
  max_budget: 0.0
  budget_duration: 1d
  max_tokens_per_request: 1700
  metadata:
    latam.trabajador.id: comprension
    latam.trabajador.version: 0.1.0
    entorno: local
