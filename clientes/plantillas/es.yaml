# CLI-1.3: plantillas críticas en español, registros usted y vos. Sin cifras ni fechas escritas: todo entra por
# marcadores `{nombre}` (plazos y normas de `policy/v1`, montos de la base). `canales` dice dónde se usa; el
# linter (CLI-1.6) las mide, las compara con la matriz y exige que cada celda tenga texto en cada registro.
version: 1
idioma: es
plantillas:
  # Estados del motor, celda por celda
  - id: inicio.chat
    canales: [chat]
    tipos: [aviso]
    marcadores: []
    textos:
      usted: >-
        Hola. Soy el asistente virtual de LATAM Bank, un sistema de inteligencia artificial.
        Si prefiere hablar con una persona, puede pedirlo en cualquier momento. ¿En qué le puedo ayudar?
      vos: >-
        Hola. Soy el asistente virtual de LATAM Bank, un sistema de inteligencia artificial.
        Si preferís hablar con una persona, podés pedirlo en cualquier momento. ¿En qué te puedo ayudar?
  - id: inicio.whatsapp
    canales: [whatsapp]
    tipos: [aviso]
    marcadores: []
    textos:
      usted: >-
        Hola. Soy el asistente virtual de LATAM Bank, una inteligencia artificial.
        Si prefiere hablar con una persona, escriba persona en cualquier momento. ¿En qué le puedo ayudar?
      vos: >-
        Hola. Soy el asistente virtual de LATAM Bank, una inteligencia artificial.
        Si preferís hablar con una persona, escribí persona en cualquier momento. ¿En qué te puedo ayudar?
  - id: inicio.voz
    canales: [voz]
    tipos: [aviso]
    marcadores: []
    textos:
      usted: >-
        Hola, soy el asistente virtual de LATAM Bank, una inteligencia artificial.
        Para hablar con una persona, diga persona o marque cero. ¿En qué le ayudo?
      vos: >-
        Hola, soy el asistente virtual de LATAM Bank, una inteligencia artificial.
        Para hablar con una persona, decí persona o marcá cero. ¿En qué te ayudo?
  - id: identificando.chat
    canales: [chat]
    tipos: [monto]
    marcadores: [cargo, comercio, fecha, monto, moneda]
    textos:
      usted: >-
        Revisé sus movimientos recientes. Encontré este {cargo}: {comercio}, el {fecha}, por {monto} {moneda}.
        ¿Es este?
      vos: >-
        Revisé tus movimientos recientes. Encontré este {cargo}: {comercio}, el {fecha}, por {monto} {moneda}.
        ¿Es este?
  - id: identificando.whatsapp
    canales: [whatsapp]
    tipos: [monto]
    marcadores: [cargo, comercio, fecha, monto, moneda]
    textos:
      usted: >-
        Revisé sus movimientos recientes. Encontré este {cargo}: {comercio}, el {fecha}, por {monto} {moneda}.
        ¿Es este? Responda sí o no.
      vos: >-
        Revisé tus movimientos recientes. Encontré este {cargo}: {comercio}, el {fecha}, por {monto} {moneda}.
        ¿Es este? Respondé sí o no.
  - id: identificando.voz
    canales: [voz]
    tipos: [monto]
    marcadores: [cargo, comercio, fecha, monto_en_palabras]
    textos:
      usted: >-
        Revisé sus movimientos. Encontré un {cargo} en {comercio}. Fue el {fecha}, por {monto_en_palabras}.
        ¿Es este? Diga sí o no.
      vos: >-
        Revisé tus movimientos. Encontré un {cargo} en {comercio}. Fue el {fecha}, por {monto_en_palabras}.
        ¿Es este? Decí sí o no.
  - id: confirmando.chat
    canales: [chat]
    tipos: [confirmacion]
    marcadores: [accion, objeto, consecuencia]
    textos:
      usted: >-
        Voy a {accion} {objeto}. Esto significa que {consecuencia}. ¿Lo confirma?
        También puede corregirlo o hablar con una persona.
      vos: >-
        Voy a {accion} {objeto}. Esto significa que {consecuencia}. ¿Lo confirmás?
        También podés corregirlo o hablar con una persona.
  - id: confirmando.whatsapp
    canales: [whatsapp]
    tipos: [confirmacion]
    marcadores: [accion, objeto, consecuencia]
    textos:
      usted: >-
        Voy a {accion} {objeto}. Esto significa que {consecuencia}. Responda sí para confirmar
        o escriba persona para hablar con alguien del equipo.
      vos: >-
        Voy a {accion} {objeto}. Esto significa que {consecuencia}. Respondé sí para confirmar
        o escribí persona para hablar con alguien del equipo.
  - id: confirmando.voz
    canales: [voz]
    tipos: [confirmacion]
    marcadores: [accion, objeto, consecuencia]
    textos:
      usted: >-
        Voy a {accion} {objeto}. Esto significa que {consecuencia}.
        Para confirmar, diga sí o marque uno. Para corregir, marque dos.
      vos: >-
        Voy a {accion} {objeto}. Esto significa que {consecuencia}.
        Para confirmar, decí sí o marcá uno. Para corregir, marcá dos.
  - id: ejecutando.chat
    canales: [chat, whatsapp]
    tipos: [general]
    marcadores: []
    textos:
      usted: Estoy procesando su solicitud. Todavía no está completada.
      vos: Estoy procesando tu solicitud. Todavía no está completada.
  - id: ejecutando.voz
    canales: [voz]
    tipos: [general]
    marcadores: []
    textos:
      usted: Un momento, estoy procesando su solicitud. Todavía no está completada.
      vos: Un momento, estoy procesando tu solicitud. Todavía no está completada.
  - id: verificando.chat
    canales: [chat, whatsapp]
    tipos: [general]
    marcadores: []
    textos:
      usted: Estoy verificando el resultado antes de confirmárselo.
      vos: Estoy verificando el resultado antes de confirmártelo.
  - id: verificando.voz
    canales: [voz]
    tipos: [general]
    marcadores: []
    textos:
      usted: Sigo verificando el resultado antes de confirmárselo.
      vos: Sigo verificando el resultado antes de confirmártelo.
  - id: informando.chat
    canales: [chat]
    tipos: [plazo, monto]
    marcadores: [numero_caso, monto, moneda, hora, norma, n, unidad, fecha]
    textos:
      usted: >-
        Su reclamo {numero_caso} por {monto} {moneda} quedó registrado a las {hora}.
        Según {norma}, LATAM Bank debe responderle en un máximo de {n} {unidad}.
        Es decir, a más tardar el {fecha}. ¿Algo más?
      vos: >-
        Tu reclamo {numero_caso} por {monto} {moneda} quedó registrado a las {hora}.
        Según {norma}, LATAM Bank debe responderte en un máximo de {n} {unidad}.
        Es decir, a más tardar el {fecha}. ¿Algo más?
  - id: informando.whatsapp
    canales: [whatsapp]
    tipos: [plazo, monto]
    marcadores: [numero_caso, monto, moneda, hora, norma, n, unidad, fecha]
    textos:
      usted: >-
        Su reclamo {numero_caso} por {monto} {moneda} quedó registrado a las {hora}.
        Según {norma}, LATAM Bank debe responderle en un máximo de {n} {unidad}.
        Es decir, a más tardar el {fecha}. Le avisaremos por este medio cuando cambie el estado.
      vos: >-
        Tu reclamo {numero_caso} por {monto} {moneda} quedó registrado a las {hora}.
        Según {norma}, LATAM Bank debe responderte en un máximo de {n} {unidad}.
        Es decir, a más tardar el {fecha}. Te avisaremos por este medio cuando cambie el estado.
  - id: informando.voz
    canales: [voz]
    tipos: [plazo, monto]
    marcadores: [numero_caso, monto_en_palabras, hora, norma, n, unidad, fecha]
    textos:
      usted: >-
        Su reclamo quedó registrado a las {hora}. Es por {monto_en_palabras}.
        El número de caso es {numero_caso}. Según {norma}, el banco debe responderle en {n} {unidad}.
        Como máximo, el {fecha}. ¿Algo más?
      vos: >-
        Tu reclamo quedó registrado a las {hora}. Es por {monto_en_palabras}.
        El número de caso es {numero_caso}. Según {norma}, el banco debe responderte en {n} {unidad}.
        Como máximo, el {fecha}. ¿Algo más?
  - id: traspaso.chat
    canales: [chat]
    tipos: [traspaso]
    marcadores: [rango_espera]
    textos:
      usted: >-
        Ya compartí lo que conversamos con una persona del equipo, así que no tendrá que repetirlo.
        La espera estimada es de {rango_espera}. ¿Prefiere seguir esperando o que le avisemos?
      vos: >-
        Ya compartí lo que conversamos con una persona del equipo, así que no tendrás que repetirlo.
        La espera estimada es de {rango_espera}. ¿Preferís seguir esperando o que te avisemos?
  - id: traspaso.whatsapp
    canales: [whatsapp]
    tipos: [traspaso]
    marcadores: [rango_espera]
    textos:
      usted: >-
        Ya compartí lo que conversamos con una persona del equipo, así que no tendrá que repetirlo.
        La espera estimada es de {rango_espera}. Le escribiremos por este medio cuando esté disponible.
      vos: >-
        Ya compartí lo que conversamos con una persona del equipo, así que no tendrás que repetirlo.
        La espera estimada es de {rango_espera}. Te escribiremos por este medio cuando esté disponible.
  - id: traspaso.voz
