    textos:
      usted: >-
        Según {norma}, este reclamo se presenta dentro de {n} {unidad} desde {evento}.
        Este {cargo} es del {fecha_cargo}, así que ese plazo venció el {fecha}.
        Si quiere, una persona del equipo revisa su caso.
      vos: >-
