    textos:
      usted: >-
        No pude completar la acción y no hicimos ningún cambio en su cuenta.
        Escriba persona para hablar con alguien del equipo, o retome esta conversación más tarde.
      vos: >-
        No pude completar la acción y no hicimos ningún cambio en tu cuenta.
