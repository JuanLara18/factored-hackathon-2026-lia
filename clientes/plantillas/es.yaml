  # Críticas fuera de la matriz: plazos, montos, cierre que distingue y frase de seguridad
  - id: plazo.respuesta.chat
    canales: [chat, whatsapp]
    tipos: [plazo]
    marcadores: [norma, n, unidad, fecha]
    textos:
      usted: >-
        Según {norma}, LATAM Bank debe responderle en un máximo de {n} {unidad}.
        Es decir, a más tardar el {fecha}.
      vos: >-
        Según {norma}, LATAM Bank debe responderte en un máximo de {n} {unidad}.
        Es decir, a más tardar el {fecha}.
