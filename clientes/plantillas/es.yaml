  - id: cierre.chat
    canales: [chat]
    tipos: [cierre]
    marcadores: [hecho, no_hecho, que_sigue]
    textos:
      usted: >-
        Resumen. Hecho: {hecho}. No hecho: {no_hecho}. Qué sigue: {que_sigue}.
        ¿Nos ayuda con una pregunta sobre la atención?
      vos: >-
        Resumen. Hecho: {hecho}. No hecho: {no_hecho}. Qué sigue: {que_sigue}.
        ¿Nos ayudás con una pregunta sobre la atención?
  - id: cierre.whatsapp
    canales: [whatsapp]
    tipos: [cierre]
    marcadores: [hecho, no_hecho, que_sigue]
    textos:
      usted: >-
        Resumen. Hecho: {hecho}. No hecho: {no_hecho}. Qué sigue: {que_sigue}.
        ¿Cómo calificaría la atención? Responda con un número del uno al cinco.
      vos: >-
        Resumen. Hecho: {hecho}. No hecho: {no_hecho}. Qué sigue: {que_sigue}.
        ¿Cómo calificarías la atención? Respondé con un número del uno al cinco.
  - id: cierre.voz
    canales: [voz]
    tipos: [cierre]
    marcadores: [hecho, no_hecho, que_sigue]
    textos:
      usted: >-
