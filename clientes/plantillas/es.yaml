    tipos: [plazo]
    marcadores: [norma, n, unidad, fecha]
    textos:
      usted: Según {norma}, el banco debe responderle en {n} {unidad}. Como máximo, el {fecha}.
      vos: Según {norma}, el banco debe responderte en {n} {unidad}. Como máximo, el {fecha}.
  - id: plazo.abono_provisional
