services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: latam
      POSTGRES_PASSWORD: latam
      POSTGRES_DB: latam
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006", "4317:4317"]
volumes:
  pg: {}
