[project]
name = "latam-tecnologia"
version = "0.1.0"
description = "VP Tecnología: núcleo, canales, plataforma"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "latam-comun",
    "pydantic-ai-slim[ag-ui]>=2.51.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latam_tecnologia"]
