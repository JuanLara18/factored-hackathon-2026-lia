name: latam_datos
version: "1.0.0"
config-version: 2
profile: latam_datos

# Los casos del fixture (unit tests de dbt) viven en datos/fixtures, junto a sus filas sintéticas
model-paths: ["models", "../fixtures"]
macro-paths: ["macros"]
seed-paths: ["../dominios"]
target-path: target
clean-targets: [target, dbt_packages, logs]

vars:
  # Reloj simulado (R-DAT-09): ningún modelo usa la hora real
  as_of: "2026-06-18 00:00:00"
  ventana_dias: 180
  # Bandas de riesgo (R-DAT-39): sobre 30 es alto (30,0 es el máximo en legítimas); desde zona_gris_desde, revisión humana
  # Duplican gobierno/politica/v1/riesgo.yaml (fuente); gobierno/tests/test_politica.py exige que coincidan
  riesgo_alto_sobre: 30
  riesgo_zona_gris_desde: 25
  directorio_version: "1.0.0"
  directorio_semilla: 202616737

seeds:
  latam_datos:
    +tags: [dominios]

models:
  latam_datos:
    +materialized: table
    plata:
      +tags: [plata]
    oro:
      +tags: [oro]
      oro_operacional_ficha_transaccion:
        +materialized: view
      oro_operacional_riesgo_transaccion:
        +materialized: view
    platino:
      +tags: [platino]

data_tests:
  +store_failures: true
  +store_failures_as: table
