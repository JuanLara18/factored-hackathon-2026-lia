version: 2

models:
  - name: plata_customers
    description: "Plata de customers: tipada, deduplicada, seudonimizada"
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: plata_products
    description: "Plata de products: tipada, deduplicada, seudonimizada"
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments: {to: ref('plata_customers'), field: customer_id}
              config: {severity: warn}
  - name: plata_transactions
    description: "Plata de transactions: tipada, deduplicada, seudonimizada"
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: ref('plata_products'), field: product_id}
              config: {severity: warn}
      - name: customer_id
        data_tests:
          - relationships:
              arguments: {to: ref('plata_customers'), field: customer_id}
              config: {severity: warn}
  - name: plata_call_center_interactions
    description: "Plata de call_center_interactions: tipada, deduplicada, seudonimizada"
    columns:
      - name: interaction_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments: {to: ref('plata_customers'), field: customer_id}
              config: {severity: warn}
  - name: plata_complaints
    description: "Plata de complaints: tipada, deduplicada, seudonimizada"
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments: {to: ref('plata_customers'), field: customer_id}
              config: {severity: warn}
      - name: affected_product_id
        data_tests:
          - relationships:
              arguments: {to: ref('plata_products'), field: product_id}
              config: {severity: warn}
  - name: plata_satisfaction_surveys
    description: "Plata de satisfaction_surveys: tipada, deduplicada, seudonimizada"
    columns:
      - name: survey_id
        data_tests: [unique, not_null]
      - name: interaction_id
        data_tests:
          - relationships:
              arguments: {to: ref('plata_call_center_interactions'), field: interaction_id}
              config: {severity: warn}
  - name: plata_service_agents
    description: "Plata de service_agents: tipada, deduplicada, seudonimizada"
    columns:
      - name: agent_id
        data_tests: [unique, not_null]
  - name: plata_call_transcripts
    description: "Plata de call_transcripts: tipada, deduplicada, seudonimizada"
    columns:
      - name: transcript_id
        data_tests: [unique, not_null]
  - name: plata_branches
    description: "Plata de branches: tipada, deduplicada, seudonimizada"
    columns:
      - name: branch_id
        data_tests: [unique, not_null]
  - name: plata_marketing_campaigns
    description: "Plata de marketing_campaigns: tipada, deduplicada, seudonimizada"
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
  - name: plata_campaign_sends
    description: "Plata de campaign_sends: tipada, deduplicada, seudonimizada"
    columns:
      - name: send_id
        data_tests: [unique, not_null]
  - name: plata_daily_exchange_rates
    description: "Tasas diarias tipadas"
    columns:
      - name: exchange_rate
        data_tests: [not_null]
  - name: plata_digital_events
    description: "Vista sobre bronce (15,6 M filas): no se materializa (decisión tomada bajo el tope de 10 GB del sandbox; con facturación podría ser tabla)"
  - name: plata_restringida_clientes
    description: "Atributos protegidos para equidad; sin PII directa"
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
