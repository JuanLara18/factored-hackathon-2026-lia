[project]
name = "latam-datos"
version = "0.1.0"
description = "VP Datos: ingesta, capas y contratos"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.104",
    "duckdb>=1.5.6",
    "latam-comun",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latam_datos"]

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.104",
    "moto[s3]>=5.2.3",
]
