[project]
name = "latam-datos"
version = "0.1.0"
description = "VP Datos: ingesta, capas y contratos"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.45.2",
    "matplotlib>=3.9",
    "latam-gobierno",
    "latam-comun",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latam_datos"]

[dependency-groups]
dev = [
    "duckdb>=1.5.6",
]
