repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: guardas-repo
        name: guardas del repositorio (datos, credenciales, diccionario)
        entry: uv run python -m latam_gobierno.guardas
        language: system
        pass_filenames: true
